<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PlumaLibre</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Merriweather:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --verde:#8FC97A; --verde-d:#5FA050; --verde-l:#E7F5DF;
  --crema:#FBF6E9; --crema2:#F1E8CE; --texto:#33291C; --sub:#7C6F55;
  --card:#ffffff; --radius:14px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
button{-webkit-appearance:none;appearance:none;font:inherit;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;font-family:'Poppins',sans-serif;background:var(--crema);color:var(--texto);}
a{color:inherit;text-decoration:none;}
header{
  position:sticky;top:0;z-index:20;background:linear-gradient(120deg,var(--verde),var(--verde-d));
  padding:calc(env(safe-area-inset-top,0px) + 12px) 18px 12px;
  display:flex;align-items:center;gap:16px;box-shadow:0 2px 10px rgba(0,0,0,.12);
}
header h1{color:#fff;margin:0;font-size:1.5em;white-space:nowrap;letter-spacing:.3px;}
nav.top{display:flex;gap:4px;}
nav.top button{background:none;border:none;color:#fff;font-family:inherit;font-size:.92em;padding:8px 10px;border-radius:8px;cursor:pointer;}
nav.top button:hover,nav.top button.active{background:rgba(255,255,255,.22);}
.promo b{color:var(--verde-d);}
main{max-width:1100px;margin:0 auto;padding:22px 16px 70px;overflow-x:hidden;}
h2.section{display:flex;align-items:center;gap:10px;font-family:'Merriweather',serif;font-size:1.3em;border-left:5px solid var(--verde);padding-left:10px;margin:26px 0 14px;}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;}
.chip{background:var(--card);border:1.5px solid var(--verde-l);padding:6px 14px;border-radius:20px;cursor:pointer;font-size:.85em;}
.chip.active,.chip:hover{background:var(--verde);color:#fff;border-color:var(--verde);}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:18px;}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.08);display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s;}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 18px rgba(0,0,0,.14);}
.cover{height:210px;background:linear-gradient(150deg,var(--verde),var(--verde-d));display:flex;align-items:flex-end;justify-content:center;color:#fff;font-weight:700;text-align:center;font-family:'Merriweather',serif;font-size:1.05em;position:relative;background-size:cover;background-position:center;overflow:hidden;}
.cover.has-img{align-items:flex-end;}
.cover .cover-title{width:100%;padding:26px 12px 10px;background:linear-gradient(to top,rgba(0,0,0,.65),transparent);}
.cover:not(.has-img) .cover-title{background:none;padding:12px;height:100%;display:flex;align-items:center;justify-content:center;}
.cover-upload{display:flex;align-items:center;gap:14px;background:var(--card);border:1.5px dashed var(--verde);border-radius:10px;padding:12px;}
.cover-upload .prev{width:64px;height:90px;border-radius:6px;background:linear-gradient(150deg,var(--verde),var(--verde-d));background-size:cover;background-position:center;flex-shrink:0;}
.cover-upload label{font-size:.9em;color:var(--sub);cursor:pointer;}
.cover-swatches{display:flex;gap:8px;margin-top:4px;}
.cover-swatches span{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;}
.cover-swatches span.active{border-color:var(--texto);}
.story-cover-thumb{width:60px;height:84px;border-radius:6px;background-size:cover;background-position:center;flex-shrink:0;}
.card .info{padding:10px 12px;}
.card .info .t{font-weight:600;font-size:.95em;margin-bottom:2px;}
.card .info small{color:var(--sub);}
.stats{display:flex;gap:10px;font-size:.78em;color:var(--sub);margin-top:6px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--verde-d);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:.9em;}
form{display:flex;flex-direction:column;gap:10px;max-width:640px;}
input,textarea,select{font-family:inherit;padding:11px;border-radius:10px;border:1.5px solid var(--verde-l);background:var(--card);color:var(--texto);font-size:1em;}
input:focus,textarea:focus{outline:none;border-color:var(--verde);}
textarea{min-height:280px;resize:vertical;font-family:'Merriweather',serif;line-height:1.6;overflow-wrap:anywhere;word-break:break-word;white-space:pre-wrap;}
input,textarea,select{box-sizing:border-box;width:100%;max-width:100%;overflow-wrap:anywhere;}
.file-input-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
.file-trigger-btn{display:inline-block;font-family:'Poppins',sans-serif;font-size:.9em;font-weight:600;color:#fff;background:var(--verde-d);border:none;border-radius:20px;padding:8px 16px;cursor:pointer;width:auto;}
.cover-upload label.file-trigger-btn{color:#fff;font-size:.9em;}
button.primary{background:var(--verde-d);color:#fff;border:none;padding:13px;border-radius:10px;font-size:1em;font-weight:600;cursor:pointer;}
button.primary:hover{filter:brightness(1.06);}
button.ghost{background:none;border:1.5px solid var(--verde-d);color:var(--verde-d);padding:10px 14px;border-radius:10px;cursor:pointer;font-family:inherit;font-weight:600;}
.story-view{background:var(--card);border-radius:var(--radius);padding:26px;max-width:760px;margin:0 auto;overflow-x:hidden;box-sizing:border-box;}
.story-view h2{margin:6px 0 4px;font-family:'Merriweather',serif;}
.meta{color:var(--sub);font-size:.9em;margin-bottom:6px;display:flex;align-items:center;gap:10px;}
.chapters{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0;}
.chapters button{background:var(--verde-l);border:none;padding:6px 12px;border-radius:8px;cursor:pointer;font-family:inherit;font-size:.85em;}
.chapters button.active{background:var(--verde-d);color:#fff;}
.story-body{white-space:pre-wrap;line-height:1.8;font-size:1.08em;font-family:'Merriweather',serif;margin:16px 0;overflow-wrap:anywhere;word-break:break-word;}
.pg-wrap{margin-bottom:10px;}
.pg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;color:var(--sub);}
.pg-prev{display:block;width:100%;height:240px;background-size:contain;background-repeat:no-repeat;background-position:center;border-radius:10px;margin:4px 0;border:1px solid var(--verde-l);background-color:var(--crema2);}
.story-img{display:block;width:100%;height:min(75vh,560px);margin:12px auto;border-radius:10px;background-size:contain;background-repeat:no-repeat;background-position:center;}
.pg-del{background:none;border:none;color:#d9534f;font-weight:600;cursor:pointer;font-family:inherit;font-size:.85em;}
.story-body.swipe-in-left{animation:swipeInLeft .22s ease-out;}
.story-body.swipe-in-right{animation:swipeInRight .22s ease-out;}
@keyframes swipeInLeft{from{opacity:0;transform:translateX(26px);}to{opacity:1;transform:translateX(0);}}
@keyframes swipeInRight{from{opacity:0;transform:translateX(-26px);}to{opacity:1;transform:translateX(0);}}
.page-dots{display:flex;justify-content:center;gap:6px;margin:4px 0 16px;}
.page-dot{width:7px;height:7px;border-radius:50%;background:var(--verde-l);transition:background .2s,transform .2s;}
.page-dot.active{background:var(--verde-d);transform:scale(1.3);}
.actions{display:flex;gap:10px;align-items:center;margin:16px 0;}
.actions button{background:var(--verde-l);border:none;padding:9px 16px;border-radius:20px;cursor:pointer;font-family:inherit;font-weight:600;}
.del-btn{background:var(--verde-l)!important;color:var(--texto)!important;border:none!important;padding:9px 16px!important;border-radius:20px!important;cursor:pointer;font-family:inherit!important;font-weight:600!important;-webkit-appearance:none;appearance:none;}
.like-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--verde-l)!important;color:var(--sub);transition:background .15s,border-color .15s,transform .1s;}
.like-btn:hover{border-color:var(--verde)!important;}
.like-btn:active{transform:scale(.96);}
.like-btn .heart-icon{width:18px;height:18px;fill:none;stroke:var(--sub);stroke-width:1.8;transition:fill .15s,stroke .15s,transform .2s;}
.like-btn.liked{background:var(--verde-l);border-color:var(--verde-d)!important;color:var(--verde-d);}
.like-btn.liked .heart-icon{fill:var(--verde-d);stroke:var(--verde-d);transform:scale(1.1);}
.save-btn{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1.5px solid var(--verde-l)!important;color:var(--sub);transition:background .15s,border-color .15s,transform .1s;}
.save-btn:hover{border-color:var(--verde)!important;}
.save-btn:active{transform:scale(.96);}
.save-icon{width:18px;height:18px;transition:fill .15s,stroke .15s,transform .2s;}
.save-btn.saved{background:var(--verde-l);border-color:var(--verde-d)!important;color:var(--verde-d);}
.save-btn.saved .save-icon{transform:scale(1.08);}
.empty{text-align:center;color:var(--sub);padding:50px 0;}
#pl-notifications{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:200;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;}
.pl-toast{pointer-events:auto;cursor:pointer;background:var(--card);border-radius:14px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:10px 14px;display:flex;align-items:center;gap:10px;max-width:92%;width:360px;animation:plToastIn .25s ease-out;border:1.5px solid var(--verde-l);}
.pl-toast.pl-toast-out{animation:plToastOut .3s ease-in forwards;}
.pl-toast-logo{width:34px;height:34px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.pl-toast-text{font-size:.85em;color:var(--texto);line-height:1.3;}
.pl-toast-title{color:var(--verde-d);font-weight:600;}
@keyframes plToastIn{from{opacity:0;transform:translateY(-16px);}to{opacity:1;transform:translateY(0);}}
@keyframes plToastOut{to{opacity:0;transform:translateY(-16px);}}
.back{display:inline-flex;align-items:center;gap:8px;background:var(--verde-l);border:none;color:var(--verde-d);cursor:pointer;font-size:1.1em;margin-bottom:14px;font-weight:700;padding:10px 26px;border-radius:20px;letter-spacing:.5px;}
.pl-tr-wait{opacity:.55;transition:opacity .2s;}
.fc-row{display:flex;gap:16px;flex-wrap:wrap;}
.fc-btn{background:none;border:none;padding:2px 0;margin:0;cursor:pointer;font-size:.92em;color:var(--sub);}
.fc-btn b{color:var(--texto);font-weight:700;}
.fc-btn:hover{text-decoration:underline;}
.back:hover{background:var(--verde);color:#fff;}
.book-icon{width:22px;height:22px;vertical-align:-5px;margin-right:2px;}

.story-view{min-width:0;}
.wall-form{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:20px;}
.wall-form textarea{min-height:80px;font-family:inherit;}
.wall-post{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;display:flex;gap:12px;}
.wall-post .wp-body{flex:1;}
.wall-post .wp-head{display:flex;align-items:center;gap:8px;margin-bottom:4px;}
.wall-post .wp-head b{font-size:.95em;}
.wall-post .wp-head small{color:var(--sub);}
.wall-post .wp-text{white-space:pre-wrap;line-height:1.5;margin:6px 0;overflow-wrap:anywhere;word-break:break-word;}
.tag-book{display:inline-block;background:var(--verde-l);color:var(--verde-d);font-size:.78em;font-weight:600;padding:2px 10px;border-radius:12px;margin-bottom:6px;}
.wp-actions{display:flex;gap:14px;margin-top:8px;}
.wp-actions button{background:none;border:none;color:var(--sub);cursor:pointer;font-family:inherit;font-size:.85em;}
.wp-img{display:block;width:auto;height:auto;max-width:min(100%,240px);max-height:180px;object-fit:cover;border-radius:10px;margin:6px 0;cursor:zoom-in;}
.wp-actions button.like-btn{background:var(--card);border:1.5px solid var(--verde-l)!important;padding:6px 14px;border-radius:20px;font-weight:600;font-size:.85em;color:var(--sub);}
.wp-actions button.like-btn.liked{background:var(--verde-l);border-color:var(--verde-d)!important;color:var(--verde-d);font-weight:600;}
.wp-actions{align-items:center;}
.wp-actions button.reply-toggle{color:var(--verde-d);font-weight:600;}
.wp-replies{margin-top:10px;display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--verde-l);padding-left:12px;}
.replies-more{align-self:flex-start;background:none;border:none;color:var(--verde-d,var(--verde));font-weight:600;font-size:.85em;cursor:pointer;padding:2px 0;font-family:inherit;}
.wp-reply{display:flex;gap:8px;align-items:flex-start;}
.wp-reply .avatar{width:26px;height:26px;font-size:.62em;flex-shrink:0;}
.wp-reply .rp-body{min-width:0;flex:1;font-size:.9em;line-height:1.35;}
.wp-reply .rp-head{display:flex;gap:6px;align-items:baseline;flex-wrap:wrap;}
.wp-reply .rp-head small{color:var(--sub);}
.wp-reply .rp-text{overflow-wrap:anywhere;white-space:pre-wrap;}
.reply-form{display:flex;gap:8px;margin-top:10px;align-items:flex-end;}
.reply-form textarea{flex:1;min-height:38px;max-height:120px;resize:vertical;margin:0;padding:8px 10px;box-sizing:border-box;}
.reply-form button{padding:9px 14px;white-space:nowrap;}
.wp-actions button.liked{color:#ff6b81;font-weight:600;}
.profile-header{display:flex;gap:16px;align-items:center;background:var(--card);border-radius:var(--radius);padding:20px;margin-bottom:20px;}
.profile-header .avatar{width:64px;height:64px;font-size:1.4em;}
nav.top{order:1;}
.notif-bell{order:2;margin-left:auto;position:relative;background:none;border:none;color:#fff;cursor:pointer;padding:8px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
.notif-bell:hover{background:rgba(255,255,255,.22);}
.notif-badge{position:absolute;top:0;right:-2px;background:#e53935;color:#fff;font-size:11px;font-weight:700;line-height:1;min-width:19px;height:19px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 4px;box-sizing:border-box;box-shadow:0 0 0 2px var(--verde-d);pointer-events:none;}
.notif-item{display:flex;gap:12px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;cursor:pointer;border:1.5px solid transparent;}
.notif-item.unread{border-color:var(--verde);background:var(--verde-l);}
.notif-item img{width:38px;height:38px;border-radius:9px;flex-shrink:0;object-fit:cover;}
.notif-item .nt-text{flex:1;min-width:0;font-size:.9em;line-height:1.35;}
.notif-item .nt-time{color:var(--sub);font-size:.75em;white-space:normal;text-align:right;max-width:92px;}
@media(max-width:720px){
  .notif-bell{order:1;}
  nav.top{order:2;flex-basis:100%;}
  header{flex-wrap:wrap;}
  .profile-header{flex-wrap:wrap;}
  .profile-header > div[style*="flex:1"]{min-width:0;}
}
:root{--pf-bg:var(--crema);--pf-card:var(--card);--pf-border:var(--verde-l);--pf-text:var(--texto);--pf-sub:var(--sub);--pf-accent:var(--verde-d);}
:root[data-theme="dark"]{--crema:#20241c;--crema2:#2b3023;--texto:#EFE9D8;--sub:#a3a08c;--card:#2b3023;--verde-l:#3a4130;--pf-bg:#111a0e;--pf-card:#1a2616;--pf-border:#2f3d29;--pf-text:#f4f7f1;--pf-sub:#8f9d88;--pf-accent:#62c04e;}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--crema:#20241c;--crema2:#2b3023;--texto:#EFE9D8;--sub:#a3a08c;--card:#2b3023;--verde-l:#3a4130;--pf-bg:#111a0e;--pf-card:#1a2616;--pf-border:#2f3d29;--pf-text:#f4f7f1;--pf-sub:#8f9d88;--pf-accent:#62c04e;}
}
/* pf-theme */
</style>
</head>

    <p style="color:var(--sub);margin:0 0 20px;font-size:.78em;text-align:center;">Escribe tu historia. Libertad creativa total: sin restricciones de temática.</p>

    <div style="display:flex;background:var(--crema2);border-radius:10px;padding:4px;margin-bottom:18px;">
      <button id="tab-login" onclick="setAuthTab('login')" style="flex:1;border:none;background:var(--verde-d);color:#fff;padding:8px;border-radius:8px;cursor:pointer;font-family:inherit;font-weight:600;">Iniciar sesión</button>

      <input id="login-username" placeholder="Nombre de usuario" style="margin-bottom:10px;">
      <div style="position:relative;margin-bottom:6px;">
        <input id="login-password" type="password" placeholder="Contraseña" style="margin-bottom:0;padding-right:40px;">
        <button type="button" onclick="togglePasswordVisibility('login-password', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:var(--sub);display:flex;"><svg width="20" height="20"><use href="#eyeIcon"/></svg></button>
      </div>
      <small id="login-error" style="display:none;color:#c0392b;font-size:.82em;">Usuario o contraseña incorrectos.</small>
      <button class="primary" style="width:100%;margin-top:10px;" onclick="doLogin()">Entrar</button>
    </div>

    <div id="auth-form-signup" style="display:none;">
      <input id="signup-username" placeholder="Nombre de usuario" style="margin-bottom:10px;">
      <div style="position:relative;margin-bottom:6px;">
        <input id="signup-password" type="password" placeholder="Contraseña" style="margin-bottom:0;padding-right:40px;">
        <button type="button" onclick="togglePasswordVisibility('signup-password', this)" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:4px;color:var(--sub);display:flex;"><svg width="20" height="20"><use href="#eyeIcon"/></svg></button>
      </div>
      <small style="color:var(--sub);font-size:.78em;display:block;margin-bottom:6px;">Mínimo 8 letras, con al menos una mayúscula.</small>
      <small id="signup-error" style="display:none;color:#c0392b;font-size:.82em;"></small>
      <button class="primary" style="width:100%;margin-top:10px;" onclick="doSignup()">Crear cuenta</button>
    </div>

    <p style="color:var(--sub);font-size:.72em;margin-top:16px;text-align:center;">Tu cuenta se guarda solo en este dispositivo/navegador. Cada dispositivo nuevo puede crear la suya propia.</p>

<script>
let stories = load('pl_stories', []).map((s,i)=> s.id ? s : Object.assign({}, s, {id:'legacy_'+i}));
let profile = load('pl_profile', {name:'Tú', bio:'', role:null});
if(profile.bio === 'Escritora/escritor en PlumaLibre.'){ profile.bio = ''; try{ localStorage.setItem('pl_profile', JSON.stringify(profile)); }catch(e){} }
let localCovers = load('pl_local_covers', {}); // {storyId: dataURL} — portadas foto, solo en este dispositivo
let myAvatarUrl = load('pl_my_avatar', null); // foto de perfil local (preview inmediata o respaldo sin db)

let accounts = load('pl_accounts', {}); // { email: {password, name} }

function togglePasswordVisibility(inputId, btn){
  const input = document.getElementById(inputId);
  if(!input) return;
  const showing = input.type === 'text';
  input.type = showing ? 'password' : 'text';
  const useEl = btn.querySelector('use');
  if(useEl) useEl.setAttribute('href', showing ? '#eyeIcon' : '#eyeOffIcon');
}

function setAuthTab(tab){
  const isLogin = tab==='login';
  document.getElementById('auth-form-login').style.display = isLogin?'block':'none';
  document.getElementById('auth-form-signup').style.display = isLogin?'none':'block';
  document.getElementById('tab-login').style.background = isLogin?'var(--verde-d)':'none';
  document.getElementById('tab-login').style.color = isLogin?'#fff':'var(--sub)';
  document.getElementById('tab-signup').style.background = isLogin?'none':'var(--verde-d)';
  document.getElementById('tab-signup').style.color = isLogin?'var(--sub)':'#fff';
}

function isValidPassword(pw){
  return pw.length >= 8 && /[A-Z]/.test(pw);
}

let dbAccountsCol = null;

// Contraseñas: nunca se guardan en texto plano. Se guarda un hash PBKDF2-SHA256 con sal aleatoria por cuenta.
const PW_ITER = 150000;
function b2h(buf){ return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function h2b(h){ const out=new Uint8Array(h.length/2); for(let i=0;i<out.length;i++) out[i]=parseInt(h.substr(i*2,2),16); return out; }
async function pbkdf2(pw, saltHex, iter){
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name:'PBKDF2', hash:'SHA-256', salt:h2b(saltHex), iterations:iter}, km, 256);
  return b2h(bits);
}
async function makeCred(pw){
  try{
    const salt = b2h(crypto.getRandomValues(new Uint8Array(16)));
    return {v:2, salt, iter:PW_ITER, hash: await pbkdf2(pw, salt, PW_ITER)};
  }catch(e){ return null; }
}
// Hash antiguo (SHA-256 sin sal): solo se usa para reconocer cuentas creadas antes y migrarlas.
async function hashPw(username, pw){
  try{
    const data = new TextEncoder().encode(username.toLowerCase()+':'+pw);
    const buf = await crypto.subtle.digest('SHA-256', data);
    return b2h(buf);
  }catch(e){ return null; }
}
async function checkCred(key, pw, cred){
  try{
    if(!cred || !cred.hash) return false;
    if(cred.v===2) return (await pbkdf2(pw, cred.salt, cred.iter||PW_ITER)) === cred.hash;
    return (await hashPw(key, pw)) === cred.hash;
  }catch(e){ return false; }
}
function pushSharedAccount(key, acc){
  if(!dbAccountsCol || !acc || acc.v!==2) return Promise.resolve();
  return dbAccountsCol.doc(sanitizeId(key)).set({name:acc.name, key, v:2, salt:acc.salt, iter:acc.iter, hash:acc.hash, date:Date.now()}).catch(err=>console.error(err));
}
// Cuentas viejas guardadas con la contraseña en texto plano: se convierten a hash y se borra el texto.
async function upgradeLocalAccount(key, pw){
  const acc = accounts[key];
  if(!acc || !acc.password) return;
  const cred = await makeCred(pw);
  if(!cred) return;
  accounts[key] = Object.assign({name:acc.name}, cred);
  save('pl_accounts', accounts);
  await pushSharedAccount(key, accounts[key]);
}

// Publica en la base compartida las cuentas guardadas en este dispositivo (solo hash con sal, nunca la contraseña).
async function syncAccountsToShared(){
  if(!dbAccountsCol) return;
  for(const key of Object.keys(accounts)){
    try{
      const ref = dbAccountsCol.doc(sanitizeId(key));
      const snap = await ref.get();
      if(snap.exists) continue;
      if(accounts[key].password) await upgradeLocalAccount(key, accounts[key].password);
      else await pushSharedAccount(key, accounts[key]);
    }catch(e){ console.error(e); }
  }
}

async function doSignup(){
  const name = document.getElementById('signup-username').value.trim();
  const key = name.toLowerCase();
  const password = document.getElementById('signup-password').value;
  const errEl = document.getElementById('signup-error');
  if(!name || !password){ errEl.textContent='Completa todos los campos.'; errEl.style.display='block'; return; }
  if(!isValidPassword(password)){ errEl.textContent='La contraseña debe tener mínimo 8 letras y al menos una mayúscula.'; errEl.style.display='block'; return; }
  if(accounts[key]){ errEl.textContent='Ese nombre de usuario ya está registrado en este dispositivo.'; errEl.style.display='block'; return; }
  if(nameTaken(name)){ errEl.textContent='Ese nombre de usuario ya está en uso.'; errEl.style.display='block'; return; }
  if(dbAccountsCol){
    try{
      const snap = await dbAccountsCol.doc(sanitizeId(key)).get();
      if(snap.exists){ errEl.textContent='Ese nombre de usuario ya está en uso.'; errEl.style.display='block'; return; }
    }catch(e){ console.error(e); }
  }
  const cred = await makeCred(password);
  accounts[key] = cred ? Object.assign({name}, cred) : {password, name};
  save('pl_accounts', accounts);
  if(cred) pushSharedAccount(key, accounts[key]);
  logIntoAccount(key);
}

let loginAttempts = 0;
async function doLogin(){
  const key = document.getElementById('login-username').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  let acc = accounts[key];
  let ok = false;
  if(acc){
    ok = acc.v===2 ? await checkCred(key, password, acc) : acc.password === password;
    if(ok && acc.password) await upgradeLocalAccount(key, password);
  }
  if(!ok && dbAccountsCol && key){
    // La cuenta puede haberse creado (o la contraseña cambiado) en otro dispositivo: se busca en la base compartida.
    try{
      const snap = await dbAccountsCol.doc(sanitizeId(key)).get();
      const data = snap.exists ? snap.data() : null;
      if(data && data.hash && await checkCred(key, password, data)){
        let cred = data.v===2 ? {v:2, salt:data.salt, iter:data.iter, hash:data.hash} : await makeCred(password);
        if(cred){
          accounts[key] = Object.assign({name: data.name || key}, cred);
          if(data.v!==2) pushSharedAccount(key, accounts[key]);
        }else{
          accounts[key] = {password, name: data.name || key};
        }
        save('pl_accounts', accounts);
        acc = accounts[key];
        ok = true;
      }
    }catch(e){ console.error(e); }
  }
  if(!ok){
    loginAttempts++;
    if(loginAttempts >= 2){ errEl.style.display='block'; }
    return;
  }
  loginAttempts = 0;
  errEl.style.display='none';
  logIntoAccount(key);
}

function logIntoAccount(key){
  const acc = accounts[key];
  const prevName = profile.name;
  profile.name = acc.name;
  save('pl_profile', profile);
  try{ localStorage.setItem('pl_logged_in_user', key); }catch(e){}
  document.getElementById('login-screen').style.display = 'none';
  subscribeFollowing();
  subscribeFollowers();
  subscribeNotifications();
  if(!openPendingProfileLink()) go('home');
  updateBellBadge();
  restoreMyData(acc.name, prevName !== 'Tú' ? prevName : null);
}

async function deleteMyAccount(){
  const pwEl = document.getElementById('da-password');
  const errEl = document.getElementById('da-error');
  const btn = document.getElementById('da-btn');
  let key = null;
  try{ key = localStorage.getItem('pl_logged_in_user'); }catch(e){}
  const acc = key ? accounts[key] : null;
  const pw = pwEl ? pwEl.value : '';
  const ok = acc ? (acc.v===2 ? await checkCred(key, pw, acc) : acc.password === pw) : false;
  if(!ok){ if(errEl) errEl.style.display = 'block'; return; }
  if(errEl) errEl.style.display = 'none';
  if(btn){ btn.disabled = true; btn.textContent = 'Eliminando…'; }

  const name = profile.name;
  const myAssetIds = [];
  if(profile.avatarAssetId) myAssetIds.push(profile.avatarAssetId);
  try{ if(unsubFollows){ unsubFollows(); unsubFollows = null; } }catch(e){}
  try{ if(unsubFollowers){ unsubFollowers(); unsubFollowers = null; } }catch(e){}
  try{ if(unsubNotifs){ unsubNotifs(); unsubNotifs = null; } }catch(e){}

  const jobs = [];
  const sid = sanitizeId(name);
  if(dbStoriesCol){
    stories.forEach(st=>{
      if(st.author === name){
        if(st.coverAssetId) myAssetIds.push(st.coverAssetId);
        jobs.push(dbStoriesCol.doc(st.id).delete());
      } else if((st.likedBy||[]).includes(name)){
        jobs.push(dbStoriesCol.doc(st.id).update({likedBy:(st.likedBy||[]).filter(x=>x!==name), likes:Math.max(0,(st.likes||1)-1)}));
      }
    });
  }
  if(dbWallCol){
    wallPosts.forEach(po=>{
      if(po.author === name){
        if(po.imageAssetId) myAssetIds.push(po.imageAssetId);
        jobs.push(dbWallCol.doc(po.id).delete());
      } else {
        const upd = {};
        if((po.replies||[]).some(r=>r.author===name)) upd.replies = po.replies.filter(r=>r.author!==name);
        if((po.likedBy||[]).includes(name)){ upd.likedBy = po.likedBy.filter(x=>x!==name); upd.likes = Math.max(0,(po.likes||1)-1); }
        if(Object.keys(upd).length) jobs.push(dbWallCol.doc(po.id).update(upd));
      }
    });
  }
  const delQuery = async (col, field)=>{
    if(!col) return;
    const snap = await col.where(field,'==',name).get();
    snap.docs.forEach(d=>jobs.push(col.doc(d.id).delete()));
  };
  try{
    await Promise.allSettled([
      delQuery(dbFollowsCol,'follower'), delQuery(dbFollowsCol,'followed'),
      delQuery(dbNotifsCol,'to'), delQuery(dbNotifsCol,'actor')
    ]);
  }catch(e){ console.error(e); }
  await Promise.allSettled(jobs);
  // Imágenes subidas (si el entorno permite borrarlas)
  try{
    const assetsApi = await claude.use('assets');
    if(assetsApi && assetsApi.delete){ await Promise.allSettled(Array.from(new Set(myAssetIds)).map(id=>assetsApi.delete(id))); }
  }catch(e){}
  // Perfil y cuenta, al final
  try{ if(dbProfilesCol) await dbProfilesCol.doc(sid).delete(); }catch(e){ console.error(e); }
  try{ if(dbAccountsCol) await dbAccountsCol.doc(sanitizeId(key)).delete(); }catch(e){ console.error(e); }

  // Datos locales
  delete accounts[key];
  save('pl_accounts', accounts);
  try{
    localStorage.removeItem('pl_logged_in_user');
    localStorage.removeItem('pl_notifs_'+sid);
    localStorage.removeItem('pl_my_avatar');
    localStorage.removeItem('pl_library');
    localStorage.removeItem('pl_following');
    localStorage.removeItem('pl_local_covers');
    localStorage.removeItem('pl_trcache');
    const dr = load('pl_drafts', []).filter(d=>d.owner!==name);
    localStorage.setItem('pl_drafts', JSON.stringify(dr));
  }catch(e){}
  library = []; following = []; myFollowers = []; notifList = []; myAvatarUrl = null;
  profile = {name:'Tú', bio:'', role:null};

const PAGE_SEP = '\n[[pagina]]\n';

function fileToDataUrl(file){ return new Promise((res,rej)=>{ const r = new FileReader(); r.onload = ()=>res(r.result); r.onerror = rej; r.readAsDataURL(file); }); }
function pgWrapHtml(pre, i, val, ph, style){

function pagesEditorHtml(pre, body, ph, style){

function shrinkToFile(file, max){
  return new Promise((resolve)=>{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = ()=>{
      try{
        const sc = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width*sc)); c.height = Math.max(1, Math.round(img.height*sc));
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
        c.toBlob(b=>{ URL.revokeObjectURL(url); resolve(b ? new File([b],'pagina.jpg',{type:'image/jpeg'}) : file); }, 'image/jpeg', 0.78);
      }catch(e){ URL.revokeObjectURL(url); resolve(file); }
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
var pageImgUploading = 0;
function cacheLocalAsset(id, dataUrl){
  localAssets[id] = dataUrl;
  try{ localStorage.setItem('pl_local_assets', JSON.stringify(localAssets)); }catch(e){ /* sin espacio: queda solo en memoria */ }

async function addImagePage(pre, inputEl){
  const file = inputEl.files && inputEl.files[0];
  if(!file){ return; }
  const btns = Array.from(inputEl.parentElement.querySelectorAll('button'));
  btns.forEach(b=>b.disabled = true);
  const lbl = btns[1], old = lbl ? lbl.textContent : '';
  if(lbl) lbl.textContent = 'Subiendo imagen…';
  pageImgUploading++;
  let el = null;
  try{
    // 1) igual que la foto de perfil: se lee la imagen y se muestra al instante en este dispositivo
    const small = await shrinkToFile(file, 1000);
    const dataUrl = await fileToDataUrl(small);
    const tmpId = 'local_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
    cacheLocalAsset(tmpId, dataUrl);
    el = appendEditorPage(pre, '[[img:'+tmpId+']]');
    if(el) el.scrollIntoView({block:'center',behavior:'smooth'});
    // 2) y se sube para que los demás también la vean
    let assetsApi = null;
    try{ assetsApi = (typeof claude !== 'undefined' && claude && claude.use) ? await claude.use('assets') : null; }catch(e){ assetsApi = null; }
    if(assetsApi){
      try{
        const res = await assetsApi.upload(small);
        cacheLocalAsset(res.id, dataUrl);
        if(el && el.isConnected){ el.dataset.img = res.id; }
      }catch(e){ console.error('subida compartida falló; la imagen queda solo en este dispositivo', e); }
    }
  }catch(err){
    console.error('page image failed', err);
    alert('No se pudo agregar la imagen. Inténtalo de nuevo.\n(Detalle: '+(err && err.message ? err.message : String(err))+')');
  }
  pageImgUploading = Math.max(0, pageImgUploading-1);
  inputEl.value = '';
  if(lbl) lbl.textContent = old;
  btns.forEach(b=>b.disabled = false);
}

function pageHtmlOf(t){
  t = t||'';
  const re = /\[\[img:([A-Za-z0-9_-]+)\]\]/g;
  let out = '', last = 0, m;
  while((m = re.exec(t))){
    out += esc(t.slice(last, m.index).replace(/^\n+|\n+$/g,''));
    out += `<div class="story-img" role="img" aria-label="Imagen" style="background-image:url('${assetSrc(m[1])}')"></div>`;
    last = m.index + m[0].length;
  }
  out += esc(t.slice(last).replace(/^\n+/,''));
  return out;
}
function paginateText(text, maxWords){
  if(PAGE_SPLIT_RE.test(text||'')){ // páginas puestas a mano por el autor
    const manual = text.split(PAGE_SPLIT_RE).map(t=>t.replace(/^\n+|\n+$/g,'')).filter(t=>t.trim());
    return manual.length ? manual : [''];
  }
  maxWords = maxWords || 200;
  const paras = (text||'').split(/\n{1,}/);
  const pages = [];
  let current = '';
  let currentWords = 0;
  for(const p of paras){
    const pWords = countWords(p);
    if(currentWords > 0 && currentWords + pWords > maxWords){
      pages.push(current);
      current = p;
      currentWords = pWords;
    } else {
      current = current ? current + '\n\n' + p : p;
      currentWords += pWords;
    }
    // Un párrafo solo ya excede el límite: se corta por palabras dentro de él.
    while(currentWords > maxWords){
      const words = current.split(/\s+/);
      const head = words.slice(0, maxWords).join(' ');
      const rest = words.slice(maxWords).join(' ');
      pages.push(head);
      current = rest;
      currentWords = countWords(rest);
    }
  }
  if(current) pages.push(current);
  return pages.length ? pages : [''];
}
function esc(s){ return (s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }
function initials(n){ return (n||'A').trim().split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase(); }
function notifTime(ts){
  const loc = plLang || 'es';
  const diff = Math.max(0, Date.now()-ts);
  const min = Math.floor(diff/60000);
  try{
    if(diff < 86400000){
      const rtf = new Intl.RelativeTimeFormat(loc,{numeric:'auto'});
      if(min<1) return rtf.format(0,'second');
      if(min<60) return rtf.format(-min,'minute');
      return rtf.format(-Math.floor(min/60),'hour');
    }
    const d = new Date(ts);
    const opts = {day:'numeric',month:'long'};
    if(d.getFullYear()!==new Date().getFullYear()) opts.year='numeric';
    return d.toLocaleDateString(loc,opts);
  }catch(e){ return timeAgo(ts); }
}
function timeAgo(ts){ const d=Math.floor((Date.now()-ts)/60000); if(d<1)return 'ahora'; if(d<60)return d+'m'; if(d<1440)return Math.floor(d/60)+'h'; return Math.floor(d/1440)+'d'; }

            <button class="save-btn ${saved?'saved':''}" onclick="toggleSave('${id}', ${chap}, ${page}, ${fromProfile}); this.blur();"><svg class="save-icon"><use href="#diskIcon"/></svg> ${saved?'Guardado':'Guardar'}</button>
            ${(fromProfile && s.author===profile.name)?`<button id="del-btn-${id}" class="del-btn" onclick="confirmDeleteStory('${id}')">Eliminar historia</button>`:''}
          </div>
      </div>
    `;

  }

}

function setupChapterSwipe(id, chap, totalChapters, page, totalPages, fromProfile){
  const el = document.getElementById('story-body-swipe');
  if(!el) return;
  let startX = 0, startY = 0, tracking = false;
  el.addEventListener('touchstart', (e)=>{
    if(e.touches.length !== 1) return;
    startX = e.touches[0].clientX;
    startY = e.touches[0].clientY;
    tracking = true;
  }, {passive:true});
  el.addEventListener('touchend', (e)=>{
    if(!tracking) return;
    tracking = false;
    const endX = e.changedTouches[0].clientX;
    const endY = e.changedTouches[0].clientY;
    const dx = endX - startX;
    const dy = endY - startY;
    if(Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy)*1.5) return; // no fue un gesto horizontal claro
    if(dx < 0){
      // siguiente página; si es la última, pasa al siguiente capítulo
      if(page < totalPages-1){
        lastSwipeDirection = 'left';
        go('read', {id, chap, page: page+1, fromProfile, keepScroll:true});
      } else if(chap < totalChapters-1){
        lastSwipeDirection = 'left';
        go('read', {id, chap: chap+1, page:0, fromProfile, keepScroll:true});
      }
    } else if(dx > 0){
      // página anterior; si es la primera, vuelve al capítulo anterior
      if(page > 0){
        lastSwipeDirection = 'right';
        go('read', {id, chap, page: page-1, fromProfile, keepScroll:true});
      } else if(chap > 0){
        lastSwipeDirection = 'right';
        go('read', {id, chap: chap-1, page:0, fromProfile, keepScroll:true}); // se abre en su primera página
      }
    }
  }, {passive:true});
}

let plAudioCtx = null;
function playNotificationChime(){
  try{
    plAudioCtx = plAudioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const ctx = plAudioCtx;
    if(ctx.state === 'suspended'){ ctx.resume(); }
    const now = ctx.currentTime;
    // Un pequeño arpegio original de 3 notas, propio de PlumaLibre, sin imitar ningún tono existente.
    const notes = [
      {freq: 880,  start: 0,    dur: 0.14}, // A5
      {freq: 1108, start: 0.11, dur: 0.14}, // C#6
      {freq: 1318, start: 0.22, dur: 0.22}, // E6
    ];
    notes.forEach(n=>{
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = n.freq;
      gain.gain.setValueAtTime(0, now + n.start);
      gain.gain.linearRampToValueAtTime(0.18, now + n.start + 0.015);
      gain.gain.exponentialRampToValueAtTime(0.001, now + n.start + n.dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + n.start);
      osc.stop(now + n.start + n.dur + 0.02);
    });
  }catch(e){ console.error('chime error', e); }
}

  return new Promise((resolve, reject)=>{

    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function shrinkDataUrl(dataUrl, max){
  return new Promise((resolve)=>{
    if(!dataUrl){ resolve(null); return; }
    const img = new Image();
    img.onload = ()=>{
      try{
        const sc = Math.min(1, max/Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(img.width*sc)); c.height = Math.max(1, Math.round(img.height*sc));
        const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0,0,c.width,c.height); ctx.drawImage(img,0,0,c.width,c.height);
        resolve(c.toDataURL('image/jpeg', 0.75));
      }catch(e){ resolve(dataUrl); }
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}

async function submitStory(e){
  e.preventDefault();
  const title = document.getElementById('f-title').value.trim();
  if(pageImgUploading){ alert('Espera un momento: la imagen todavía se está subiendo.'); return false; }
  const body = getPagesValue('f-body');
  const genres = Array.from(document.querySelectorAll('#f-genres .chip.active')).map(c=>c.dataset.genre);
  if(!title||!body) return false;
  const genreErr = document.getElementById('f-genre-error');
  if(genres.length===0){ genreErr.style.display='block'; return false; }
  genreErr.style.display='none';
  const submitBtn = e.target.querySelector('button[type=submit]');
  if(submitBtn){ submitBtn.disabled = true; submitBtn.textContent = 'Publicando…'; }
  const newStory = {
    title, author: profile.name, genres,
    coverColor: pendingCoverColor,
    chapters: [{title: document.getElementById('f-chapter-title').value || 'Capítulo 1', body}],
    likes:0, likedBy:[], date: Date.now()
  };
  if(dbStoriesCol){
    const ref = dbStoriesCol.doc(); // id generado ya mismo, sin esperar la red
    if(pendingCoverFile){
      // Respaldo inmediato: quien publica ve su portada al instante en su propio
      // dispositivo, sin esperar a que termine de subirse el archivo compartido.
      if(!pendingCoverImg){
        try{ pendingCoverImg = await readFileAsDataURL(pendingCoverFile); }catch(err){ console.error(err); }
      }
      if(pendingCoverImg){ localCovers[ref.id] = pendingCoverImg; save('pl_local_covers', localCovers); }
      try{
        const assetsApi = await claude.use('assets');
        if(assetsApi){
          const res = await assetsApi.upload(pendingCoverFile);
          newStory.coverAssetId = res.id; // visible para todos los dispositivos
        }
      }catch(err){
        console.error('cover asset upload failed', err);
      }
    }
    ref.set(newStory).catch(err=>console.error(err));
    if(!profile.private){ myFollowers.forEach(fn=>sendNotification(fn, 'story_'+ref.id+'_'+sanitizeId(fn), {type:'story', title:newStory.title, storyId:ref.id})); }
  } else {
    newStory.id = 'local_'+Date.now()+'_'+Math.random().toString(36).slice(2);
    newStory.coverImg = pendingCoverImg;
    if(pendingCoverImg){ localCovers[newStory.id] = pendingCoverImg; save('pl_local_covers', localCovers); }
    stories.unshift(newStory);
    save('pl_stories', stories);
  }
  if(currentDraftId){
    try{
      let drafts = load('pl_drafts', []);
      drafts = drafts.filter(d=>d.id!==currentDraftId);
      save('pl_drafts', drafts);
    }catch(err){}
    currentDraftId = null;
  }
  go('home');
  return false;
}

function toggleLike(id, chap, page, fromProfile){
  const myName = profile.name;
  if(dbStoriesCol){
    const ref = dbStoriesCol.doc(id);
    ref.get().then(snap=>{
      if(!snap.exists) return;
      const data = snap.data() || {};
      const likedBy = data.likedBy || [];
      const li = likedBy.indexOf(myName);
      let newLikedBy, newLikes;
      if(li>-1){ newLikedBy = likedBy.filter(x=>x!==myName); newLikes = Math.max(0,(data.likes||1)-1); }
      else { newLikedBy = likedBy.concat([myName]); newLikes = (data.likes||0)+1; }
      ref.update({likedBy:newLikedBy, likes:newLikes}).catch(err=>console.error(err));
      if(li<=-1){ sendNotification(data.author, 'like_'+id+'_'+sanitizeId(myName), {type:'like', title:data.title, storyId:id}); }
    }).catch(err=>console.error(err));
    return;
  }
  const s = stories.find(x=>x.id===id);
  if(!s) return;
  s.likedBy = s.likedBy || [];
  const idx = s.likedBy.indexOf(myName);
  if(idx>-1){ s.likedBy.splice(idx,1); s.likes = Math.max(0,(s.likes||1)-1); }
  else { s.likedBy.push(myName); s.likes = (s.likes||0)+1; }
  save('pl_stories', stories);
  go('read',{id, chap:chap||0, page:page||0, fromProfile:!!fromProfile, keepScroll:true});
}

function toggleSave(id, chap, page, fromProfile){
  const idx = library.indexOf(id);
  if(idx>-1) library.splice(idx,1); else library.push(id);
  save('pl_library', library);
  go('read',{id, chap:chap||0, page:page||0, fromProfile:!!fromProfile, keepScroll:true});
}

function containsVulgar(text){
  let t = String(text||'').toLowerCase().replace(/ñ/g,'§').normalize('NFD').replace(/[̀-ͯ]/g,'');
  t = t.replace(/[@4]/g,'a').replace(/3/g,'e').replace(/(?<=[a-z0-9@$])[1!|](?=[a-z0-9@$])/g,'i').replace(/0/g,'o').replace(/[$5]/g,'s').replace(/7/g,'t');
  const raw = t.split(/[^a-z§]+/).filter(Boolean);
  const toks = [];
  let run = '';
  raw.forEach(w=>{
    if(w.length===1){ run += w; }
    else { if(run.length>=3) toks.push(run); run=''; toks.push(w); }
  });
  if(run.length>=3) toks.push(run);
  return toks.some(w=>{
    const c = w.replace(/(.)\1+/g,'$1');
    return VULGAR_PATTERNS.some(re=>re.test(w) || re.test(c));
  });
}

  w.textContent = msg;
  clearTimeout(w._t); w._t = setTimeout(()=>{ try{ w.remove(); }catch(e){} }, 5000);
}

function toggleWallLike(id){
  const myName = profile.name;
  if(dbWallCol){
    const ref = dbWallCol.doc(id);
    ref.get().then(snap=>{
      if(!snap.exists) return;
      const data = snap.data() || {};
      const likedBy = data.likedBy || [];
      const li = likedBy.indexOf(myName);
      let newLikedBy, newLikes;
      if(li>-1){ newLikedBy = likedBy.filter(x=>x!==myName); newLikes = Math.max(0,(data.likes||1)-1); }
      else { newLikedBy = likedBy.concat([myName]); newLikes = (data.likes||0)+1; }
      ref.update({likedBy:newLikedBy, likes:newLikes}).catch(err=>console.error(err));
    }).catch(err=>console.error(err));
    return;
  }
  const p = wallPosts.find(x=>x.id===id);
  if(!p) return;
  p.likedBy = p.likedBy || [];
  const li = p.likedBy.indexOf(myName);
  if(li>-1){ p.likedBy.splice(li,1); p.likes = Math.max(0,(p.likes||1)-1); }
  else{ p.likedBy.push(myName); p.likes = (p.likes||0)+1; }
  save('pl_wall', wallPosts);
  go('wall');
}

function nameTaken(newName){
  const n = newName.trim().toLowerCase();
  let myKey = null;
  try{ myKey = localStorage.getItem('pl_logged_in_user'); }catch(e){}
  const usedByAccount = Object.keys(accounts||{}).some(key => key === n && key !== myKey);
  const usedByStories = stories.some(s => (s.author||'').trim().toLowerCase() === n && s.author !== profile.name);
  const usedByWall = wallPosts.some(p => (p.author||'').trim().toLowerCase() === n && p.author !== profile.name);
  return usedByAccount || usedByStories || usedByWall;
}

var dataRestoring = !!(function(){ try{ return localStorage.getItem('pl_logged_in_user'); }catch(e){ return null; } })();
var dataSyncTimer = null;
function myDataDocId(name){ return sanitizeId(name)+'__data'; }
function schedulePrefsSync(){
  if(dataRestoring) return;
  clearTimeout(dataSyncTimer);
  dataSyncTimer = setTimeout(pushMyData, 1500);
}
function pushMyData(){
  if(dataRestoring || !dbProfilesCol || !profile.name || profile.name==='Tú') return;
  let loggedIn = null; try{ loggedIn = localStorage.getItem('pl_logged_in_user'); }catch(e){}
  if(!loggedIn) return;
  let drafts = load('pl_drafts', []).filter(d=>d.owner===profile.name);
  try{ if(JSON.stringify(drafts).length > 700000) drafts = drafts.map(d=>Object.assign({}, d, {coverImg:null})); }catch(e){}
  dbProfilesCol.doc(myDataDocId(profile.name)).set({
    owner: profile.name, library: library || [], drafts,
    theme: load('pl_theme', null), lang: plLang || 'es', muted: !!notificationsMuted, updated: Date.now()
  }).catch(err=>console.error('push data', err));
  try{ localStorage.setItem('pl_data_owner', profile.name); }catch(e){}
}
async function restoreMyData(name, prevName){
  dataRestoring = true;
  let owner = null; try{ owner = localStorage.getItem('pl_data_owner'); }catch(e){}
  if(!owner) owner = prevName || null;
  const sameOwner = owner === name;
  let d = null, p = null, failed = false;
  if(dbProfilesCol){
    try{
      const r = await Promise.all([dbProfilesCol.doc(myDataDocId(name)).get(), dbProfilesCol.doc(sanitizeId(name)).get()]);
      d = r[0].exists ? r[0].data() : null;
      p = r[1].exists ? r[1].data() : null;
    }catch(e){ console.error('restore data', e); failed = true; }
  }
  if(failed){ return; } // sin lectura segura no se escribe nada (dataRestoring queda activo en esta sesión)
  if(!sameOwner){ // los datos locales eran de otra persona: se limpian
    library = []; save('pl_library', library);
    myAvatarUrl = null; try{ localStorage.removeItem('pl_my_avatar'); }catch(e){}
    profile.avatarAssetId = null; profile.role = null; profile.bio = '';
    localCovers = {}; save('pl_local_covers', localCovers);
  }
  if(p){
    if(p.role !== undefined && p.role !== null) profile.role = p.role;
    if(p.avatarAssetId){
      profile.avatarAssetId = p.avatarAssetId;
      myAvatarUrl = '/_blob/'+p.avatarAssetId;
      try{ localStorage.setItem('pl_my_avatar', JSON.stringify(myAvatarUrl)); }catch(e){}
    }
    if(p.private !== undefined) profile.private = !!p.private;
  }
  if(d){
    if(Array.isArray(d.library)){ library = d.library; try{ localStorage.setItem('pl_library', JSON.stringify(library)); }catch(e){} }
    try{
      const others = load('pl_drafts', []).filter(x=>x.owner!==name);
      localStorage.setItem('pl_drafts', JSON.stringify(others.concat(Array.isArray(d.drafts)?d.drafts.map(x=>Object.assign({}, x, {owner:name})):[])));
    }catch(e){}
    if(d.theme){ try{ localStorage.setItem('pl_theme', JSON.stringify(d.theme)); }catch(e){} applyTheme(); }
    if(typeof d.muted === 'boolean'){ notificationsMuted = d.muted; try{ localStorage.setItem('pl_muted', JSON.stringify(d.muted)); }catch(e){} }
    if(d.lang && d.lang !== plLang){
      try{ restoreSpanish(document.body); }catch(e){}
      trBlocked = false; plLang = d.lang;
      try{ localStorage.setItem('pl_lang', JSON.stringify(d.lang)); }catch(e){}
      try{ applyLanguage(); }catch(e){}
    }
  }
  save('pl_profile', profile);
  try{ localStorage.setItem('pl_data_owner', name); }catch(e){}
  dataRestoring = false;
  // Si la cuenta aún no tenía respaldo en la nube, se crea ahora con lo que hay en este dispositivo
  syncMyRoleToShared();
  pushMyData();
  if(typeof ensureAvatarShared==='function') ensureAvatarShared();
  try{ if(['home','profile','library','settings','wall'].indexOf(currentView)>-1) go(currentView, {keepScroll:true}); }catch(e){}
}

async function ensureAvatarShared(){
  // si tengo foto en este dispositivo pero aún no está en la base compartida, la subo para que todos (y mis comentarios antiguos) la vean
  if(avatarEnsuring || !dbProfilesCol || !myAvatarUrl || profile.avatarAssetId || !profile.name || profile.name==='Tú') return;
  avatarEnsuring = true;
  try{
    const assetsApi = await claude.use('assets');

function applyWallAvatars(){
  ensureAvatarShared();
  document.querySelectorAll('.wall-post .avatar[data-author]').forEach(el=>{
    const name = el.dataset.author;

      if(!url || !el.isConnected) return;

      el.style.backgroundSize = 'cover';
      el.style.backgroundPosition = 'center';
      el.textContent = '';
    };
    if(name === profile.name){ setUrl(myAvatarUrl || (profile.avatarAssetId ? '/_blob/'+profile.avatarAssetId : null)); return; }
    if(!dbProfilesCol) return;
    const c = wallAvatarCache[name];
    if(!c || Date.now()-c.t > 20000){
      wallAvatarCache[name] = {t:Date.now(), p: dbProfilesCol.doc(sanitizeId(name)).get().then(snap=>{
        const id = snap.exists && snap.data() ? snap.data().avatarAssetId : null;

  const curOk = acc ? (acc.v===2 ? await checkCred(key, current, acc) : acc.password === current) : false;
  if(!acc || !curOk){
    errEl.textContent = 'La contraseña actual no es correcta.';
    errEl.style.display = 'block';
    return;
  }
  if(!isValidPassword(newPw)){
    errEl.textContent = 'La contraseña nueva debe tener mínimo 8 letras y al menos una mayúscula.';
    errEl.style.display = 'block';
    return;
  }
  errEl.style.display = 'none';
  const newCred = await makeCred(newPw);
  if(newCred){ delete acc.password; Object.assign(acc, newCred); } else { acc.password = newPw; }
  save('pl_accounts', accounts);
  if(newCred) pushSharedAccount(key, acc);
  document.getElementById('cp-current').value = '';
  document.getElementById('cp-new').value = '';
  okEl.style.display = 'block';
}

let CUR = EN, CUR_PAT = EN_PAT;
function setCur(){
  if(plLang==='es'||plLang==='en'||!LANG_DICT[plLang]){ CUR=EN; CUR_PAT=EN_PAT; return; }
  CUR = Object.assign({}, EN, LANG_DICT[plLang]);
  CUR_PAT = LANG_PAT[plLang].map(([r,t])=>[new RegExp(r),t]).concat(EN_PAT.filter((_,i)=>![0,1,2,4,5].includes(i)));
}
setCur();
function trPiece(p){
  if(Object.prototype.hasOwnProperty.call(CUR,p)) return CUR[p];
  if(p.indexOf(', ')>-1){
    return p.split(', ').map(g=>Object.prototype.hasOwnProperty.call(CUR,g)?CUR[g]:g).join(', ');
  }
  return p;
}
function trCore(core){
  if(Object.prototype.hasOwnProperty.call(CUR,core)) return CUR[core];
  for(const [re,rp] of CUR_PAT){ if(re.test(core)) return core.replace(re,rp); }
  if(core.indexOf('·')>-1){
    return core.split('·').map(part=>{
      const m = part.match(/^(\s*)([\s\S]*?)(\s*)$/);
      return m[2] ? m[1]+trPiece(m[2])+m[3] : part;
    }).join('·');
  }
  return core;
}
function trText(raw){
  const m = raw.match(/^(\s*)([\s\S]*?)(\s*)$/);
  if(!m[2]) return raw;
  const out = trCore(m[2]);
  return out===m[2] ? raw : m[1]+out+m[3];
}

const PL_SKIP = 'script,style,textarea,[data-nt],.story-body,.wp-text,.cover-title,.pl-toast-title,.info .t,.story-view h2';
const PL_ATTRS = ['placeholder','title','aria-label'];

function translateTextNode(n){
  if(plLang==='es' || plOrig.has(n)) return;
  const el = n.parentElement;
  if(!el || el.closest(PL_SKIP)) return;
  const nv = n.nodeValue;
  const out = trText(nv);
  if(out!==nv){ plOrig.set(n,nv); n.nodeValue = out; }
}
function translateAttrs(el){
  if(el.closest && el.closest('[data-nt]')) return;
  PL_ATTRS.forEach(a=>{
    const v = el.getAttribute(a);
    if(v && !el.hasAttribute('data-plorig-'+a)){
      const out = trCore(v);
      if(out!==v){ el.setAttribute('data-plorig-'+a, v); el.setAttribute(a,out); }
    }
  });
}
function translateTree(root){
  if(plLang==='es') return;
  if(root.nodeType===3){ translateTextNode(root); return; }
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(translateTextNode);
  if(root.matches && root.matches('[placeholder],[title],[aria-label]')) translateAttrs(root);
  if(root.querySelectorAll) root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(translateAttrs);
}
function restoreSpanish(root){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{ if(plOrig.has(n)){ n.nodeValue = plOrig.get(n); plOrig.delete(n); } });
  PL_ATTRS.forEach(a=>{
    root.querySelectorAll('[data-plorig-'+a+']').forEach(el=>{
      el.setAttribute(a, el.getAttribute('data-plorig-'+a));
      el.removeAttribute('data-plorig-'+a);
    });
  });
}
function applyLanguage(){
  setCur();
  document.documentElement.setAttribute('lang', plLang);
  document.documentElement.setAttribute('dir', plLang==='ar' ? 'rtl' : 'ltr');
  if(plLang==='es') restoreSpanish(document.body);
  else { translateTree(document.body); schedUserTr(); }
}
function setLanguage(code){
  restoreSpanish(document.body);
  trBlocked = false;
  plLang = code;
  save('pl_lang', code);
  applyLanguage();
  go('language');
}

}

// ===== Traducción del contenido de las historias (usa Claude vía la capacidad "sample") =====
const USER_SEL = '.story-body,.cover-title,.info .t,.story-view h2,.chapters button:not([style])';
let trCache = load('pl_trcache', {});
const trOut = new Set();
let trTimer = null, trBusy = false, trBlocked = false, trPending = false;
function trKey(lang,t){ return lang+'|'+t; }
function schedUserTr(){
  if(plLang==='es' || trBlocked) return;
  clearTimeout(trTimer);
  trTimer = setTimeout(runUserTr, 350);
}
function collectUserNodes(){
  const out = [];
  document.querySelectorAll(USER_SEL).forEach(el=>{
    const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT);
    while(w.nextNode()){
      const n = w.currentNode, t = n.nodeValue.trim();
      if(t.length<3 || /^[^\s]+\s\d+$/.test(t) || trOut.has(t)) continue;
      out.push(n);
    }
  });
  return out;
}
function persistTrCache(){
  const keys = Object.keys(trCache);
  if(keys.length > 400){ keys.slice(0, keys.length-400).forEach(k=>delete trCache[k]); }
  save('pl_trcache', trCache);
}
async function runUserTr(){
  if(plLang==='es' || trBlocked) return;
  if(trBusy){ trPending = true; return; }
  const lang = plLang;
  const todo = [];
  collectUserNodes().forEach(n=>{
    const t = n.nodeValue.trim(), c = trCache[trKey(lang,t)];
    if(c){ n.nodeValue = n.nodeValue.replace(t, ()=>c); trOut.add(c); } else todo.push(n);
  });
  if(!todo.length) return;
  trBusy = true;
  const parents = todo.map(n=>n.parentElement).filter(Boolean);
  parents.forEach(el=>el.classList.add('pl-tr-wait'));
  try{
    const sample = await claude.use('sample');
    if(!sample){ trBlocked = true; return; }
    const langName = (PL_LANGS.find(l=>l.code===lang)||{}).name || lang;
    const uniq = Array.from(new Set(todo.map(n=>n.nodeValue.trim())));
    const chunks = []; let cur = [], len = 0;
    uniq.forEach(t=>{ if(cur.length && (len+t.length>5000 || cur.length>=25)){ chunks.push(cur); cur=[]; len=0; } cur.push(t); len+=t.length; });
    if(cur.length) chunks.push(cur);
    for(const chunk of chunks){
      if(plLang!==lang) break;
      const res = await sample.json(
        'Translate each string of the JSON array into '+langName+' (language code '+lang+'). Keep the meaning, tone, punctuation and line breaks. Do not add notes. If a string is already in that language, return it unchanged. Reply ONLY with a JSON array of strings with the same length and order.\n\n'+JSON.stringify(chunk),
        {modelTier:'quick'}
      );
      if(!Array.isArray(res) || res.length!==chunk.length) continue;
      chunk.forEach((t,i)=>{ if(typeof res[i]==='string' && res[i].trim()) trCache[trKey(lang,t)] = res[i].trim(); });
      persistTrCache();
      if(plLang===lang){
        todo.forEach(n=>{
          if(!n.isConnected) return;
          const t = n.nodeValue.trim(), c = trCache[trKey(lang,t)];
          if(c && chunk.includes(t)){ n.nodeValue = n.nodeValue.replace(t, ()=>c); trOut.add(c); }
        });
      }
    }
  }catch(err){
    console.error('translate stories', err);
    if(err && (err.code==='not_granted' || err.code==='rate_limited' || err.code==='capability_disabled')) trBlocked = true;
  }finally{
    parents.forEach(el=>el.classList.remove('pl-tr-wait'));
    trBusy = false;
    if(trPending){ trPending = false; schedUserTr(); }
  }
}
new MutationObserver(muts=>{
  if(plLang==='es') return;
  schedUserTr();
  muts.forEach(m=>m.addedNodes.forEach(n=>{
    if(n.nodeType===3 || n.nodeType===1) translateTree(n);
  }));
}).observe(document.body,{childList:true,subtree:true});
applyLanguage();

    ta.remove();
    return !!ok;
  }catch(e){ return false; }
}
async function shareProfile(){
  const link = PL_APP_URL + '#perfil=' + encodeURIComponent(profile.name);
  const text = plLang==='en' ? ('Check out my profile on PlumaLibre: '+profile.name) : ('Mira mi perfil en PlumaLibre: '+profile.name);
  try{
    if(navigator.share){
      await navigator.share({title:'PlumaLibre', text, url:link});
      return;
    }
  }catch(e){
    if(e && e.name==='AbortError') return; // la persona cerró el menú de compartir
  }
  if(await copyText(text+' '+link)){ showInfoToast('Enlace copiado'); }
  else { showLinkBox(link); }
}

// ===== Historial de notificaciones (permanente) =====
let dbNotifsCol = null;
let unsubNotifs = null;
let notifList = [];
let notifFirstLoad = true;
let viewUnreadIds = new Set();

function notifKey(){ return 'pl_notifs_'+sanitizeId(profile.name); }
// Con la base compartida las notificaciones viven ahí (no se pierden al cambiar de dispositivo ni al borrar datos del navegador).
function loadNotifs(){ return dbNotifsCol ? notifList : load(notifKey(), []); }
function saveNotifs(list){ if(!dbNotifsCol) save(notifKey(), list); }
function unreadCount(){ return loadNotifs().filter(n=>!n.read).length; }
function updateBellBadge(){
  const b = document.getElementById('notif-badge');
  if(!b) return;
  const n = unreadCount();
  b.textContent = n>9 ? '9+' : String(n);
  b.style.display = n>0 ? 'flex' : 'none';
}
// Modo sin base de datos: se guarda en este dispositivo y nunca se recorta.
function addNotification(n){
  const list = load(notifKey(), []);
  list.unshift(Object.assign({id:'n_'+Date.now()+'_'+Math.random().toString(36).slice(2), date:Date.now(), read:false}, n));
  save(notifKey(), list);
  if(currentView==='notifications'){ go('notifications'); } else { updateBellBadge(); }
}
// Modo con base de datos: quien hace la acción deja el aviso guardado para la otra persona.
function sendNotification(toName, id, data){
  if(!dbNotifsCol || !toName || toName===profile.name) return;
  dbNotifsCol.doc(id).set(Object.assign({to:toName, actor:profile.name, date:Date.now(), read:false}, data)).catch(err=>console.error(err));
}
function markAllNotificationsRead(list){
  if(dbNotifsCol){
    notifList = notifList.map(n=>Object.assign({},n,{read:true}));
    list.filter(n=>!n.read).forEach(n=>{ dbNotifsCol.doc(n.id).update({read:true}).catch(err=>console.error(err)); });
  } else {
    saveNotifs(list.map(n=>Object.assign({},n,{read:true})));
  }
}
function toastNotification(n){
  if(n.type==='reply') showReplyNotification(n.actor, n.text, true);
  else if(n.type==='story') showAppNotification(n.actor, n.title, n.storyId, true);
  else if(n.type==='like') showLikeNotification(n.actor, n.title, true);
  else showFollowNotification(n.actor, true);
}
function subscribeNotifications(){
  if(!dbNotifsCol || !profile.name) return;
  if(unsubNotifs){ unsubNotifs(); unsubNotifs = null; }
  notifFirstLoad = true;
  let prevIds = new Set();
  unsubNotifs = dbNotifsCol.where('to','==',profile.name).onSnapshot(
    (snap)=>{
      const list = snap.docs.map(d=>Object.assign({id:d.id}, d.data())).sort((a,b)=>(b.date||0)-(a.date||0));
      if(!notifFirstLoad){
        list.filter(n=>!prevIds.has(n.id) && !n.read).forEach(n=>toastNotification(n));
      }
      notifFirstLoad = false;
      prevIds = new Set(list.map(n=>n.id));
      notifList = list;
      if(currentView==='notifications'){ go('notifications'); } else { updateBellBadge(); }
    },
    (err)=>{ console.error('notifications db error', err); }
  );
}
function openNotification(id){
  const n = loadNotifs().find(x=>x.id===id);
  if(!n) return;
  if(n.type==='story' && n.storyId) go('read', {id:n.storyId, chap:0, fromProfile:false});
  else if(n.type==='follow') go('author', {name:n.actor});
  else if(n.type==='reply') go('wall');
  else go('profile');
}
function notificationHtml(n, wasUnread){
  const logoEl = document.querySelector('header h1 img');
  const logo = logoEl ? logoEl.src : '';
  let msg = '';
  if(n.type==='reply') msg = `<b>${esc(n.actor)}</b> respondió a tu publicación<div class="pl-toast-title">${esc(n.text||'')}</div>`;
  else if(n.type==='story') msg = `<b>${esc(n.actor)}</b> publicó una historia nueva<div class="pl-toast-title">${esc(n.title||'')}</div>`;
  else if(n.type==='like') msg = `<b>${esc(n.actor)}</b> le dio 💚 a tu historia<div class="pl-toast-title">${esc(n.title||'')}</div>`;
  else msg = `<b>${esc(n.actor)}</b> empezó a seguirte`;
  return `<div class="notif-item ${wasUnread?'unread':''}" onclick="openNotification('${n.id}')">
    <img src="${logo}" alt="PlumaLibre">
    <div class="nt-text">${msg}</div>
    <div class="nt-time" data-nt>${notifTime(n.date)}</div>
  </div>`;
}

// ===== Modo claro / oscuro =====
function isDarkTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  if(cur) return cur==='dark';
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme(){
  const t = load('pl_theme', null);
  if(t) document.documentElement.setAttribute('data-theme', t);
  else document.documentElement.removeAttribute('data-theme');
}
function toggleTheme(){
  save('pl_theme', isDarkTheme() ? 'light' : 'dark');
  applyTheme();
  go(document.getElementById('settings-root')?'settings':'profile', {keepScroll:true});
}
applyTheme();

go('home');
updateBellBadge();
if(localStorage.getItem('pl_logged_in_user') && accounts[localStorage.getItem('pl_logged_in_user')]){ openPendingProfileLink(); }
</script>
